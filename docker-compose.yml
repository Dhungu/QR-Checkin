services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: checkin
      POSTGRES_PASSWORD: checkin
      POSTGRES_DB: checkin
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U checkin -d checkin"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+asyncpg://checkin:checkin@db:5432/checkin
      AUTO_CREATE_TABLES: "false"          # schema is managed by Alembic
      QR_HMAC_SECRET: ${QR_HMAC_SECRET:-dev-only-secret-change-me-please-0123456789}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-dev-admin-key}
      STAFF_API_KEY: ${STAFF_API_KEY:-dev-staff-key}

volumes:
  pgdata:
