[project]
name = "qr-event-checkin"
version = "1.0.0"
description = "QR-based event check-in with HMAC-signed tickets and race-safe scanning"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["B008", "UP042"]

[tool.ruff.lint.per-file-ignores]
"alembic/*" = ["E501", "UP", "I"]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
